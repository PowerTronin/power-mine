name: Windows Packages

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Packages
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $paths = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "C:\msys64\ucrt64\bin",
            "C:\msys64\mingw64\bin"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Add-Content $env:GITHUB_PATH $path
            }
          }

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\go\bin"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: power-mine-windows-amd64
          path: |
            dist/*windows*.exe
            dist/*windows*.exe.sha256
          if-no-files-found: error

      - name: Attach Windows packages to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*windows*.exe
            dist/*windows*.exe.sha256
